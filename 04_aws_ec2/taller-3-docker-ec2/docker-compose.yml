services:
  api:
    build: ./app
    container_name: api
    volumes:
      - /etc/hostname:/host_hostname:ro

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
